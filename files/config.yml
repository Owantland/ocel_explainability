order_management:
  ocel_path: "files/databases/order_management.sqlite"
  graph_output_path: "files/graph_structures/order_management/"
  pytorch_path: 'files/hetero_structures/order_management/'
  model_output_path: 'files/models/order_management/'
  viewpoint: "Orders"
  added_depth: 0
  unique_ids: ['Orders', 'Items', 'Packages']
  kpi_type: 1
  kpi_event: "CreatePackage" #"CreatePackage" "PackageDelivered" "PayOrder"
  kpi_viewpoint: "Orders"
  filtered_tables: ['object_object', 'event_object', 'event_map_type', 'object_map_type']
  attributes:
    Orders: ['price']
    Items: ['weight', 'price']
    Packages: ['weight']
  time_attributes:
    Products: ['weight', 'price'] # First value is the set attribute and the second one is the time sensitive one
  encoding: ['Customers', 'Employees']

logistics:
  ocel_path: "files/databases/logistics.sqlite"
  graph_output_path: "files/graph_structures/logistics/"
  pytorch_path: 'files/hetero_structures/logistics/'
  model_output_path: 'files/models/logistics/'
  viewpoint: "CustomerOrder"
  added_depth: 2
  unique_ids: ['CustomerOrder', 'TransportDocument', 'Container', 'HandlingUnit']
  kpi_type: 0
  kpi_event: "Depart"
  kpi_viewpoint: "TransportDocument"
  filtered_tables: ['object_object', 'event_object', 'event_map_type', 'object_map_type']
  attributes:
    CustomerOrder: ['AmountofGoods']
    Container: ['AmountofHandlingUnits', 'Weight']
    TransportDocument: ['AmountofContainers']
  time_attributes:
    Products: [ 'weight', 'price' ] # First value is the set attribute and the second one is the time sensitive one
  encoding: ['HandlingUnit', 'Truck', 'Forklift', 'Vehicle']


